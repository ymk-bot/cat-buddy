<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Cat Buddy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      background: transparent;
      overflow: hidden;
      font-family: sans-serif;
    }

    .hint {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.5);
      font-size: 13px;
      letter-spacing: 1px;
      z-index: 10;
      -webkit-app-region: no-drag;
    }

    /* ── working 상태 ── */
    .cat-working {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(62, 65, 95, 0.6);
      border: 8px solid rgba(62, 65, 95, 0.95);
      border-radius: 16px;
      box-sizing: border-box;
      -webkit-app-region: drag;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    .cat-working video {
      width: calc(100vw - 48px);
      height: calc(100vh - 48px);
      object-fit: contain;
      border-radius: 10px;
      -webkit-app-region: drag;
    }

    /* ── sleeping 상태 ── */
    .cat-sleeping {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 16px 16px 14px;
      background: rgba(20, 20, 40, 0.85);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15);
      -webkit-app-region: drag;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    .cat-sleeping video {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      -webkit-app-region: no-drag;
    }

    .cat-sleeping .label {
      color: rgba(255,255,255,0.7);
      font-size: 11px;
      letter-spacing: 1px;
      -webkit-app-region: no-drag;
    }

    /* ── questioning 상태 ── */
    .cat-questioning {
      position: fixed;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 16px;
      background: rgba(255, 200, 0, 0.6);
      border-radius: 24px;
      border: 2px solid rgba(255, 190, 0, 0.85);
      animation: question-pulse 1.2s ease-in-out infinite alternate;
      -webkit-app-region: drag;
      transition: opacity 0.4s ease;
      opacity: 1;
    }

    .cat-questioning .question-mark {
      font-size: 44px;
      animation: question-bounce 0.7s ease-in-out infinite alternate;
      -webkit-app-region: no-drag;
    }

    .cat-questioning video {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 16px;
      -webkit-app-region: no-drag;
    }

    @keyframes question-bounce {
      from { transform: translateY(0px); }
      to   { transform: translateY(-8px); }
    }

    @keyframes question-pulse {
      from { box-shadow: 0 0 12px rgba(255, 180, 0, 0.4); }
      to   { box-shadow: 0 0 28px rgba(255, 180, 0, 0.8); }
    }

    .hidden {
      opacity: 0 !important;
      pointer-events: none;
    }
  </style>
</head>
<body>

<div class="cat-working" id="catWorking">
    <video autoplay loop muted playsinline></video>
  </div>

  <div class="cat-sleeping hidden" id="catSleeping">
    <video src="sleeping.mp4" autoplay loop muted playsinline></video>
    <div class="label">기다리는 중</div>
  </div>

  <div class="cat-questioning hidden" id="catQuestioning">
    <div class="question-mark">❓</div>
    <video src="questioning.mp4" autoplay loop muted playsinline></video>
  </div>

  <script>
    const working = document.getElementById('catWorking')
    const sleeping = document.getElementById('catSleeping')
    const questioning = document.getElementById('catQuestioning')

    const isElectron = typeof window !== 'undefined' && window.process?.type === 'renderer'
    const ipc = isElectron ? window.require('electron').ipcRenderer : null

    const fs = isElectron ? window.require('fs') : null
    const path = isElectron ? window.require('path') : null

    function pickRandom(stateName) {
      if (!fs || !path) return null
      const dir = path.join(__dirname, 'videos', stateName)
      try {
        const files = fs.readdirSync(dir).filter(f => /\.(mp4|webm|mov)$/i.test(f))
        if (files.length === 0) return null
        return path.join(dir, files[Math.floor(Math.random() * files.length)])
      } catch { return null }
    }

    function playRandom(el, stateName) {
      const src = pickRandom(stateName)
      if (src) {
        const videoEl = el.querySelector('video')
        videoEl.src = src
        if (stateName === 'working') {
          videoEl.onloadedmetadata = () => {
            if (ipc) ipc.send('video-loaded', { width: videoEl.videoWidth, height: videoEl.videoHeight })
            videoEl.onloadedmetadata = null
          }
        }
        videoEl.play()
      }
    }

    // UI만 바꾸는 함수 (IPC 전송 없음 — 루프 방지)
    function updateUI(state) {
      working.classList.add('hidden')
      sleeping.classList.add('hidden')
      questioning.classList.add('hidden')
      if (state === 'working') {
        playRandom(working, 'working')
        working.classList.remove('hidden')
      } else if (state === 'sleeping') {
        playRandom(sleeping, 'sleeping')
        sleeping.classList.remove('hidden')
      } else if (state === 'questioning') {
        playRandom(questioning, 'questioning')
        questioning.classList.remove('hidden')
      }
    }

    // 키보드 단축키: UI 바꾸고 main에도 알림 (창 크기 변경)
    function showWorking() {
      updateUI('working')
      if (ipc) ipc.send('state-working')
    }

    function showSleeping() {
      updateUI('sleeping')
      if (ipc) ipc.send('state-sleeping')
    }

    function showQuestioning() {
      updateUI('questioning')
      if (ipc) ipc.send('state-questioning')
    }

    // HTTP 서버에서 신호가 올 때: UI만 바꿈 (창 크기는 main이 이미 바꿈)
    if (ipc) {
      ipc.on('show-working', () => updateUI('working'))
      ipc.on('show-sleeping', () => updateUI('sleeping'))
      ipc.on('show-questioning', () => updateUI('questioning'))
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === '1') showWorking()
      if (e.key === '2') showSleeping()
      if (e.key === '3') showQuestioning()
      if (e.key === 'Escape' && ipc) ipc.send('quit')
    })

    updateUI('working')
  </script>

</body>
</html>
